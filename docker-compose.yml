services:
  mailflare:
    build: .
    image: mailflare:local
    restart: unless-stopped

    environment:
      APP_URL: https://${DOMAIN}
      PORT: "3000"
      DATA_DIR: ${DATA_DIR}
      SMTP_INBOUND_PORT: "0"
      INBOUND_WEBHOOK_SECRET: ${INBOUND_WEBHOOK_SECRET}
      SMTP_URL: ${SMTP_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CF_TOKEN: ${CF_TOKEN}

    volumes:
      - /srv/docker/mailflare/data:/data

    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
